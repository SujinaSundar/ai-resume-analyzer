name: CI Pipeline

on:
  push:
   
jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Sync Dependencies
      run: uv sync

    - name: Run Tests
      run: uv run pytest

    - name: Run Pylint
      run: uv run pylint app/